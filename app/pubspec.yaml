name: formation
description: "Formation - fantasy sports for real tokenized stocks on Solana"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8


  # Navigation (Changed from 10.1.2 to carets for latest compatibility)
  auto_route: ^11.1.0

  # State Management
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0      # Updated to allow newer build tools
  equatable: ^2.0.7

  # Immutable Models & Serialization (Upgraded to unlock modern build runner)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Backend
  supabase_flutter: ^2.9.1

  # Environment
  envied: ^1.1.1

  # UI
  flutter_svg: ^2.2.0
  cached_network_image: ^4.0.0  # Upgraded
  google_fonts: ^8.2.1          # Upgraded
  flutter_animate: ^4.5.2
  flutter_styled_toast: ^2.2.1
  crystal_navigation_bar: ^1.0.0

  # Auth
  google_sign_in: ^7.2.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.0           # Upgraded
  timeago: ^3.7.1
  app_links: ^7.2.1             # Upgraded
  file_picker: ^13.1.0          # Upgraded

  # Solana (Web3 flavor)
  solana_mobile_client: ^0.1.2
  solana: ^0.32.0+1             # Upgraded

  firebase_core: ^4.7.0
  http: ^1.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

   # Code Generation (Replaced 'any' with modern constraints)
  build_runner: ^2.16.1
  auto_route_generator: ^10.6.0
  json_serializable: ^6.14.1
  freezed: ^4.0.1
  envied_generator: ^1.3.9

  # Asset Generation (Replaced 'any' with modern constraints)
  flutter_gen: ^5.15.0
  flutter_gen_runner: ^5.15.0

  # App Icons
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dependency_overrides:
  freezed_annotation: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/brand/

flutter_gen:
  output: lib/gen/
  line_length: 80
  # Optional
  integrations:
    flutter_svg: true


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/formation_white.png"

flutter_native_splash:
  color: "#000000"
  image: assets/brand/formation_black.png
  android_12:
    color: "#000000"
    image: assets/brand/formation_black.png