// Vendored from solana_mobile_client 0.1.2 and patched for AGP 9 built-in Kotlin:
// the upstream file applies 'kotlin-android', which AGP 9 rejects when
// android.builtInKotlin=true (required by share_plus 13.x).
group 'com.solana.solana_mobile_client'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 31
    namespace "com.solana.solana_mobile_client"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 19
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation "com.solanamobile:mobile-wallet-adapter-clientlib:1.1.0"
}
